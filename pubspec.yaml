name: my_pills
description: "MyPills — medication tracker. Client-only Flutter MVP."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

# Dependency notes:
#   drift / drift_flutter / drift_dev  — local DB, analogous to EF Core
#   flutter_riverpod / riverpod_*      — state management / DI container
#   go_router                           — declarative navigation
#   freezed_annotation / freezed        — immutable records (≈ C# records)
#   json_annotation / json_serializable — JSON codegen
#   sqlite3_flutter_libs                — native SQLite bindings
dependencies:
  drift: ^2.31.0
  drift_flutter: 0.2.8
  flutter:
    sdk: flutter
  flutter_animate: ^4.1.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  go_router: ^14.8.1
  healthicons_flutter: ^3.5.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  permission_handler: ^11.3.0
  riverpod_annotation: 4.0.2
  shared_preferences: ^2.3.4
  sqlite3_flutter_libs: ^0.5.24
  timezone: ^0.10.0
  flutter_timezone: ^5.0.0
  flutter_local_notifications: ^19.0.0
  device_calendar: ^4.3.3
  device_info_plus: ^11.2.0
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1


dependency_overrides:
  # device_calendar 4.3.3 pins timezone ^0.9.x but the API surface we use
  # (TZDateTime.from + Location) is unchanged in 0.10. flutter_local_notifications
  # 19+ requires timezone 0.10 to fix the Android 14 alarm-firing bug, so we
  # override here. Remove once device_calendar publishes a 0.10-compatible release.
  timezone: ^0.10.0

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.31.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.9.5
  mocktail: ^1.0.4
  riverpod_generator: 4.0.3
  very_good_analysis: ^10.2.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  generate: true   # enables flutter gen-l10n

  assets:
    - assets/fonts/
    - assets/quotes_es.json
    - assets/images/greeting_bg.png
    - assets/images/app_logo.png

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
