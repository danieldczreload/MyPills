include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"

linter:
  rules:
    # Docs are not required for this app (not a published package)
    public_member_api_docs: false
    # Drift uses $-prefixed column names in generated DAOs
    non_constant_identifier_names: false
